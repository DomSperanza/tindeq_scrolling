# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate
# TindeqScrolling.xcodeproj is generated and gitignored; edit this file instead.
name: TindeqScrolling

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Apple Developer Team ID (Xcode → Settings → Accounts), or pick
    # the team in Signing & Capabilities after generating.
    DEVELOPMENT_TEAM: ""

packages:
  TindeqCore:
    path: Packages/TindeqCore

targets:
  TindeqScrolling:
    type: application
    platform: iOS
    sources:
      - path: TindeqScrolling
        excludes:
          - "Injected/**"
          - "Info.plist"
      - path: TindeqScrolling/Injected
        buildPhase: resources
    dependencies:
      - package: TindeqCore
    info:
      path: TindeqScrolling/Info.plist
      properties:
        CFBundleDisplayName: Tindeq Scrolling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: >-
          Tindeq Scrolling connects to your Tindeq Progressor to read pull force,
          which keeps reels playing and scrolls to the next one.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Change to your own reverse-DNS identifier before the first device build.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tindeqscrolling
        PRODUCT_NAME: TindeqScrolling
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true

schemes:
  TindeqScrolling:
    build:
      targets:
        TindeqScrolling: all
    run:
      config: Debug
    archive:
      config: Release
